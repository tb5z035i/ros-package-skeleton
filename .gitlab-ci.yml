stages:
  - build
  - verify
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

variables:
  ROS_DISTRO: "jazzy"
  TARGET_ARCH: "amd64"
  ROS_IMAGE_REPOSITORY: "ros"
  # GitLab supplies the raw access token; the runner needs auth before pulling image.
  DOCKER_AUTH_CONFIG: >-
    {"auths":{"registry.jihulab.com":{"username":"oauth2","password":"${ROS_IMAGE_ACCESS_KEY}"}}}
  ROSDISTRO_INDEX_URL: "https://mirrors.tuna.tsinghua.edu.cn/rosdistro/index-v4.yaml"
  BUILD_JOBS: "2"
  DEBIAN_FRONTEND: "noninteractive"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_DEPTH: "0"

default:
  image: "${ROS_IMAGE_REPOSITORY}:${ROS_DISTRO}-ros-core"
  tags:
    - "$TARGET_ARCH"
  interruptible: true

.target_matrix:
  parallel:
    matrix:
      - ROS_DISTRO: [jazzy, humble]
        TARGET_ARCH: [amd64]
        ROS_IMAGE_REPOSITORY: [registry.jihulab.com/discoverrobotics/s2-restricted/data-factory/registry/ros]
      - ROS_DISTRO: [jazzy, humble]
        TARGET_ARCH: [arm64]
        ROS_IMAGE_REPOSITORY: [registry.jihulab.com/discoverrobotics/s2-restricted/data-factory/registry/ros]

build_and_package:
  extends: .target_matrix
  stage: build
  rules:
    - when: on_success
  before_script:
    - bash scripts/install-build-tools
    - bash scripts/prepare-sources
    - bash scripts/install-deps
  script:
    - bash scripts/ci-build
  artifacts:
    name: "$CI_JOB_NAME_SLUG"
    when: always
    expire_in: 1 week
    paths:
      - dist/
    reports:
      junit:
        - dist/**/test-results/*.xml
        - build/*/pytest.xml
        - build/**/test_results/**/*.xml

# A new container has neither the build tools nor the workspace install overlay.
verify_deb:
  extends: .target_matrix
  stage: verify
  allow_failure: true
  rules:
    - when: on_success
  needs:
    # Download all four uniquely named targets; verify only this job's target.
    - job: build_and_package
      artifacts: true
  script:
    - ROS_DEB_TEST_DISPOSABLE=1 ROS_DEB_TEST_REPORTS="dist/$ROS_DISTRO/$TARGET_ARCH/install-test-results" bash tests/smoke-installed "dist/$ROS_DISTRO/$TARGET_ARCH/"*.deb
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/*/*/install-test-results/
    reports:
      junit: dist/**/install-test-results/*.xml

release_packages:
  stage: release
  interruptible: false
  needs:
    - job: build_and_package
      artifacts: true
    - job: verify_deb
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - bash scripts/configure-mirrors
    - apt-get -o Acquire::Retries=3 update
    - apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3 python3-tomli curl ca-certificates
  script:
    - python3 scripts/ci_publish_gitlab_release.py
